# The build farm's frontend, and nothing else, for clients on another Docker network (README,
# "Tenant namespaces", "The build farm's network"). Optional, and a Compose project of its own, so
# starting or removing it never touches the node:
#
#   FARM_FORWARD_NETWORK=<network> docker compose -f farm-forward.yml up -d
#   docker compose -p ci-farm down
#
# <network> is an existing Docker network the clients are on. Clients reach the frontend as
# build-farm:8980 on that network, through socat: one TCP port, forwarded byte for byte, so TLS
# ends at the frontend and the forwarder holds no key. The frontend's certificate names
# build-farm (scripts/farm-tls.sh). Run it once the tenant has applied the server: until then
# the port behind it is closed.
#
# On the stack network the forwarder only ever connects to the frontend's NodePort on the node's
# address (manifests/tenants/build-farm/server/frontend.yaml, frontend-external), and it routes
# nothing between the two networks (ip_forward is off). Its own address there is fixed: the
# frontend's NetworkPolicy lets in that address and no other on the stack network
# (manifests/tenants/build-farm/networkpolicy.yaml). So the forwarder must not carry anyone else
# from there: it listens only on its address on the clients' network, which nothing on the stack
# network can reach, and turns away that network's gateway, which is the host (Docker lets the
# host reach every container's address, internal networks too). The gateway is the subnet's first
# address, as Docker's default; set FARM_FORWARD_GATEWAY if the clients' network has another
# (`docker network inspect <network>` shows it). If you change the stack subnet
# (docker-compose.yml), change both addresses here and the policy's too.
name: ci-farm

services:
  forward:
    # socat 1.8 on Alpine, pinned by digest; the same image as api-forward.yml.
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    # busybox's sh, ip and ipcalc from the image. Each connection gets its own sh and socat: the sh
    # checks the peer's address (SOCAT_PEERADDR, named after -lp) and the socat connects. socat
    # would split a colon in SYSTEM's command, so the target is in the environment.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        runners=172.31.250.12
        client=$$(ip -4 -o addr show scope global | awk '{print $$4}' | grep -v "^$$runners/")
        [ "$$(echo "$$client" | wc -l)" = 1 ] || { echo "not one address beside $$runners: $$client" >&2; exit 1; }
        net=$$(ipcalc -n "$$client" | sed 's/^NETWORK=//')
        GATEWAY=$${FARM_FORWARD_GATEWAY:-$${net%.*}.$$(( $${net##*.} + 1 ))}
        TARGET=TCP4:172.31.250.10:30980
        export GATEWAY TARGET
        echo "listening on $${client%/*}:8980, refusing $$GATEWAY, to $$TARGET"
        exec socat -lp socat "TCP4-LISTEN:8980,bind=$${client%/*},fork,reuseaddr,max-children=64" \
          SYSTEM:'[ "$$SOCAT_PEERADDR" != "$$GATEWAY" ] && exec socat - "$$TARGET"'
    environment:
      FARM_FORWARD_GATEWAY: ${FARM_FORWARD_GATEWAY:-}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 256
    sysctls:
      net.ipv4.ip_forward: 0
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
    networks:
      runners:
        ipv4_address: 172.31.250.12
      clients:
        aliases:
          - build-farm

networks:
  # The stack network, created by docker-compose.yml (project "ci", network "runners").
  runners:
    external: true
    name: ci_runners
  clients:
    external: true
    name: ${FARM_FORWARD_NETWORK:?set FARM_FORWARD_NETWORK to the clients' Docker network}
