# Who reaches the example's service, on top of the namespace's own pods (../base/networkpolicy.yaml):
# its port, 8080, and nothing else, for the forwarder (tenant-forward.yml), by its fixed address on
# the stack network, through the tenant's NodePort. Nothing else: not the other tenants, not the
# host or anything else on the stack network (the NodePort answers on the node's addresses, and
# this policy is what turns them away, since the Service keeps the source address with
# externalTrafficPolicy Local).
#
# The admin applies it with the namespace; a tenant can read it, not change it. It names pods by
# their label, which the tenant sets: the tenant decides which of its pods is the service.
#
# A tenant that serves the runners too adds an egress policy for them in arc-runners, applied by the
# admin (the runners' own allow DNS and the proxy only), and lets the namespace arc-runners in here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The forwarder's fixed address on the stack network (tenant-forward.yml).
        - ipBlock:
            cidr: 172.31.250.12/32
      ports:
        - protocol: TCP
          port: 8080
