# Who reaches the build farm's frontend (server/frontend.yaml), on top of the namespace's own pods
# (../base/networkpolicy.yaml): its gRPC port, 8980, and nothing else, for
#   - the runner pods in arc-runners, through the cluster's DNS (frontend.build-farm.svc), which
#     their own egress policy allows (../../networkpolicy-runners.yaml, allow-build-farm);
#   - the forwarder (farm-forward.yml), by its fixed address on the stack network, through the
#     NodePort frontend-external. It carries the clients on another Docker network.
# Nothing else: not the other tenants, not the host or anything else on the stack network (the
# NodePort answers on the node's addresses, and this policy is what turns them away), and not
# the internet, which reaches no port of the stack. The frontend speaks TLS only.
#
# The admin applies it with the namespace (kustomization.yaml); a tenant can read it, not change
# it. It names pods by their label, which the tenant sets: the tenant decides which of its pods
# is the frontend, as it decides what the frontend serves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners
        # The forwarder's fixed address on the stack network (farm-forward.yml).
        - ipBlock:
            cidr: 172.31.250.12/32
      ports:
        - protocol: TCP
          port: 8980
