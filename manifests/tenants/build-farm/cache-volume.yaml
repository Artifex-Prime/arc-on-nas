# The build farm's cache: Buildbarn's storage (server/config/cache.libsonnet), on a host directory
# of its own (README, "Tenant namespaces", "A tenant's cache on the host"). Cluster-scoped, so the
# admin applies it, with the rest of this directory; the claim it is reserved for is
# cache-claim.yaml.
#
# A static PersistentVolume, as for the runners' cache (../../cache.yaml): Pod Security's baseline
# level and ../admission.yaml forbid hostPath in a tenant's pod, but allow it to mount a claim.
#
# The path is the k3s container's. The host's directory is bind-mounted there by a line in
# docker-compose.override.yml (README), which is not in docker-compose.yml because the cache is
# optional. The directory below it must exist and belong to the storage pod's user, uid and gid
# 65532, before a pod mounts it:
#   sudo install -d -o 65532 -g 65532 -m 700 /path/to/build-farm-cache/storage
#
# Bound to the one claim named in claimRef: an unclaimed volume binds to any claim that fits, in
# any namespace, and so to another tenant's.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: build-farm-cache
  labels:
    app.kubernetes.io/part-of: arc-on-nas
spec:
  capacity:
    # The host filesystem's quota. Informational: Kubernetes does not limit a hostPath volume's size.
    # Buildbarn's files stay below it by their configured sizes (scripts/check-consistency.sh).
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  # Deleting the claim keeps the volume and the data; it then binds to nothing until the admin
  # removes claimRef.uid or recreates it.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: build-farm
    name: cache
  hostPath:
    path: /var/lib/build-farm-cache/storage
    # Fail rather than create it root-owned, which the storage pod could not write.
    type: Directory
