# The tenant namespace build-farm: remote build and test execution, and its cache (the volume and
# its claim; the cache's sizes are in build-farm/cache.libsonnet).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: build-farm
resources:
  - namespace.yaml
  - quota.yaml
  - cache-volume.yaml
  - cache-claim.yaml
  - ../base
