# The tenant namespace build-farm: remote build and test execution, and its cache (the volume and
# its claim; the cache's sizes are in server/config/cache.libsonnet). The server itself, server/,
# is the tenant's to apply, and is not listed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: build-farm
resources:
  - namespace.yaml
  - quota.yaml
  - cache-volume.yaml
  - cache-claim.yaml
  - ../base
