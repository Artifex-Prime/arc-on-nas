# Buildbarn's scheduler (config/scheduler.jsonnet): the queue of actions between the frontend and
# the execution workers (not part of this directory). One replica, replaced by stopping the old one first: two schedulers would
# split the workers and the clients between them. Its queue is in memory, so a restart fails the
# operations in it, and their clients retry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          # yamllint disable-line rule:line-length
          image: ghcr.io/buildbarn/bb-scheduler:20261102T094740Z-c9ba98c@sha256:50789bdae47ee83905c059f88adbf22c9253139883723f76fbed27def8b0c566
          args: [/config/scheduler.jsonnet]
          env:
            - {name: GOMEMLIMIT, value: 200MiB}
          ports:
            - {name: client-grpc, containerPort: 8982}
            - {name: worker-grpc, containerPort: 8983}
            - {name: metrics, containerPort: 9980}
          readinessProbe:
            grpc: {port: 8982}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Measured idle at about 30 MiB. Its queue grows with the actions waiting in it.
          resources:
            requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "1", memory: 256Mi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: buildbarn-config}
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: scheduler
spec:
  selector:
    app.kubernetes.io/name: scheduler
  ports:
    # From the frontend.
    - {name: client-grpc, port: 8982, targetPort: client-grpc}
    # From the workers.
    - {name: worker-grpc, port: 8983, targetPort: worker-grpc}
