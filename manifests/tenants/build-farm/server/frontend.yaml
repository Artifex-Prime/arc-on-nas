# Buildbarn's frontend (config/frontend.jsonnet): the farm's one address for clients,
# frontend.build-farm:8980, for the remote cache and remote execution, over TLS with the key pair
# in the Secret frontend-tls (scripts/farm-tls.sh), and for clients with a credential only
# (config/auth.libsonnet): GitHub's keys in the ConfigMap github-jwks (github-jwks.yaml), and the
# revoked clients in the ConfigMap farm-revoked, which the tenant makes (README, "The build farm's
# credentials"). It holds no state of its own, so an update
# starts the new pod and waits until it is ready before it stops the old one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        # The key pair's files are the group's (defaultMode below), so the frontend reads them and
        # nothing else in the pod would.
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          # yamllint disable-line rule:line-length
          image: ghcr.io/buildbarn/bb-storage:20261102T091443Z-ca3d8b4@sha256:fecab707a842ee1915f2eea06810a1eb2eacc876d498648c67ba32230717f212
          args: [/config/frontend.jsonnet]
          env:
            - {name: GOMEMLIMIT, value: 400MiB}
          ports:
            - {name: grpc, containerPort: 8980}
            - {name: metrics, containerPort: 9980}
          # The diagnostics server's health check: the kubelet's gRPC probe speaks no TLS. It
          # answers once every gRPC server has started, with its key pair loaded.
          readinessProbe:
            httpGet: {path: /-/healthy, port: metrics}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Measured at about 30 MiB idle and 200 MiB after a burst of uploads (the Go heap, which
          # GOMEMLIMIT keeps below the limit).
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "2", memory: 512Mi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: github-jwks, mountPath: /auth/github, readOnly: true}
            - {name: revoked, mountPath: /auth/revoked, readOnly: true}
      volumes:
        - name: config
          configMap: {name: buildbarn-config}
        # Not with subPath: the kubelet then updates the files when the Secret changes.
        - name: tls
          secret: {secretName: frontend-tls, defaultMode: 0440}
        # Both read again while the frontend runs: GitHub's keys every 5 minutes, the revoked
        # clients every minute. The frontend does not start without either: it would then let
        # nobody in, or not know whom to keep out.
        - name: github-jwks
          configMap: {name: github-jwks}
        - name: revoked
          configMap: {name: farm-revoked}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - {name: grpc, port: 8980, targetPort: grpc}
---
# The frontend for clients outside the cluster: the forwarder (farm-forward.yml) connects to this
# port on the node's address, 172.31.250.10:30980. "Local" keeps the connection's source address,
# the forwarder's, so the frontend's NetworkPolicy (../networkpolicy.yaml) can let it in by
# address; with "Cluster" kube-proxy would replace it with the node's. The quota allows this one
# NodePort (../quota.yaml).
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - {name: grpc, port: 8980, targetPort: grpc, nodePort: 30980}
