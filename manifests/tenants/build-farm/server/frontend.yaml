# Buildbarn's frontend (config/frontend.jsonnet): the farm's one address for clients,
# frontend.build-farm:8980, for the remote cache and remote execution. It holds no state of its
# own, so an update starts the new pod and waits until it is ready before it stops the old one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          # yamllint disable-line rule:line-length
          image: ghcr.io/buildbarn/bb-storage:20261102T091443Z-ca3d8b4@sha256:fecab707a842ee1915f2eea06810a1eb2eacc876d498648c67ba32230717f212
          args: [/config/frontend.jsonnet]
          env:
            - {name: GOMEMLIMIT, value: 400MiB}
          ports:
            - {name: grpc, containerPort: 8980}
            - {name: metrics, containerPort: 9980}
          readinessProbe:
            grpc: {port: 8980}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Measured at about 30 MiB idle and 200 MiB after a burst of uploads (the Go heap, which
          # GOMEMLIMIT keeps below the limit).
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "2", memory: 512Mi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: buildbarn-config}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - {name: grpc, port: 8980, targetPort: grpc}
