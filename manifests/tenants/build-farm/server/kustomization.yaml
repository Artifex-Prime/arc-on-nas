# The build farm's server: Buildbarn's storage, frontend and scheduler in build-farm, and the job
# that keeps GitHub's keys for the frontend (README, "Tenant namespaces", "The build farm's
# server", "The build farm's credentials"). Namespaced only, so the tenant applies it with their
# own certificate, after the admin has applied ../ (the namespace, its quota, the cache's volume,
# the job's API access), the claim `cache` is bound, and the frontend's Secret and two ConfigMaps
# exist (frontend.yaml):
#   kubectl -n build-farm apply -k manifests/tenants/build-farm/server
# Not part of ../kustomization.yaml, which the admin applies.
#
# The configuration is generated into one ConfigMap, whose name carries a hash of its contents:
# a changed file makes a new ConfigMap, and every pod that mounts it is replaced.
#
# The versions. Buildbarn has no releases; bb-deployments pins a tested set, and this follows it
# (at its commit 7cd419f, 2026-11-06). bb-storage serves both the storage pod and the frontend.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: build-farm
labels:
  - pairs:
      app.kubernetes.io/part-of: arc-on-nas
    includeSelectors: false
resources:
  - storage.yaml
  - scheduler.yaml
  - frontend.yaml
  - github-jwks.yaml
configMapGenerator:
  - name: buildbarn-config
    files:
      - config/auth.libsonnet
      - config/cache.libsonnet
      - config/clients.libsonnet
      - config/common.libsonnet
      - config/topology.libsonnet
      - config/storage.jsonnet
      - config/frontend.jsonnet
      - config/scheduler.jsonnet
      - config/github-jwks.jsonnet
