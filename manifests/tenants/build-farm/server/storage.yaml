# Buildbarn's storage: the cache (config/storage.jsonnet, its sizes in config/cache.libsonnet), on
# the claim `cache` (../cache-claim.yaml), a host directory of its own.
#
# One pod, never two: two storage processes on the same files would corrupt them, and the volume
# is ReadWriteOnce on one node. A StatefulSet of one replica deletes the old pod and waits until it
# is gone before it starts the new one, on every update and restart.
#
# On SIGTERM bb-storage writes its state files before it exits, so a pod restart keeps everything
# stored. A crash, or a node stopped without stopping its pods, loses what was stored after the
# last state file it wrote: normally the last five minutes or so, more when syncing was slow or
# failing (cache.libsonnet).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
spec:
  replicas: 1
  serviceName: storage
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The host directory's owner (../cache-volume.yaml). A hostPath volume ignores fsGroup.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # Time for the final sync and the state files (above).
      terminationGracePeriodSeconds: 120
      initContainers:
        # bb-storage creates its files but not their directories: cache.libsonnet's `directories`
        # (scripts/check-consistency.sh keeps the two lists the same). They outlive the pod; this
        # makes them again after the cache was emptied.
        - name: directories
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - mkdir
            - -m
            - "0700"
            - -p
            - /cache/cas/persistent_state
            - /cache/cas-chunk-map/persistent_state
            - /cache/ac/persistent_state
            - /cache/fsac/persistent_state
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 100m, memory: 32Mi, ephemeral-storage: 16Mi}
          volumeMounts:
            - {name: cache, mountPath: /cache}
      containers:
        - name: storage
          # yamllint disable-line rule:line-length
          image: ghcr.io/buildbarn/bb-storage:20261102T091443Z-ca3d8b4@sha256:fecab707a842ee1915f2eea06810a1eb2eacc876d498648c67ba32230717f212
          args: [/config/storage.jsonnet]
          env:
            # The Go heap's target, below the limit: the rest is for the page cache of the files,
            # which the kernel charges to the pod and reclaims when it nears the limit.
            - {name: GOMEMLIMIT, value: 640MiB}
          ports:
            - {name: grpc, containerPort: 8981}
            - {name: metrics, containerPort: 9980}
          readinessProbe:
            grpc: {port: 8981}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Measured idle at about 30 MiB; the limit leaves room for the files' page cache.
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "2", memory: 1Gi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: config
          configMap: {name: buildbarn-config}
        - name: cache
          persistentVolumeClaim: {claimName: cache}
---
# Headless: the frontend and the scheduler reach the pod as storage-0.storage
# (config/topology.libsonnet).
apiVersion: v1
kind: Service
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: storage
  ports:
    - {name: grpc, port: 8981, targetPort: grpc}
